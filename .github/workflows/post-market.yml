name: Daily post-market selection

on:
  schedule:
    # Beijing time, weekdays. Multiple crons to dodge GitHub schedule skips.
    - cron: "40 7 * * 1-5"   # 15:40
    - cron: "50 7 * * 1-5"   # 15:50 兜底
    - cron: "0 8 * * 1-5"    # 16:00 兜底
    - cron: "45 10 * * 1-5"  # 18:45 兜底
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trading date YYYY-MM-DD"
        required: false
        type: string

concurrency:
  group: post-market-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  calculate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build browser application
        env:
          VITE_API_MODE: static
          VITE_API_BASE_URL: https://hahapokar.github.io/limitup-mobile
        run: |
          npm ci
          npm run build
          mkdir -p public
          cp -R dist/. public/

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check if should run
        id: trading-day
        env:
          TZ: Asia/Shanghai
        run: |
          today="$(date +%F)"
          # Auto-triggered runs skip if today's snapshot was already published.
          if [ -z "${{ inputs.trade_date }}" ] && [ -f public/snapshot.json ]; then
            published_date="$(python -c "import json; print(json.load(open('public/snapshot.json')).get('trade_date',''))")"
            if [ "$published_date" = "$today" ]; then
              echo "Snapshot for $today already published; skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          trade_date="${{ inputs.trade_date }}"
          if [ -z "$trade_date" ]; then
            trade_date="$today"
          fi
          python - "$trade_date" <<'PY'
          import os
          import sys
          from quant_system.utils.calendar import is_trade_day

          trade_date = sys.argv[1]
          should_run = is_trade_day(trade_date)
          print(f"{trade_date}: {'trading day' if should_run else 'market holiday/weekend'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={'true' if should_run else 'false'}\n")
          PY

      - name: Calculate daily snapshot
        if: steps.trading-day.outputs.should_run == 'true'
        env:
          TZ: Asia/Shanghai
        run: |
          if [ -n "${{ inputs.trade_date }}" ]; then
            trade_date="${{ inputs.trade_date }}"
          else
            trade_date="$(date +%F)"
          fi
          if [ "$(date +%F)" = "$trade_date" ] && [ "$(date +%H%M)" -lt "1530" ]; then
            echo "${trade_date} has not reached the 15:30 Beijing close; no FINAL snapshot can be published."
            exit 1
          fi
          python scripts/publish_snapshot.py --date "$trade_date" --output public

      - name: Sync snapshot to docs and publish
        if: steps.trading-day.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reflect new snapshot files (written to public/ by publish_snapshot.py) into docs/.
          cp -R public/. docs/
          rm -f docs/server.cjs docs/server.cjs.map
          git add public quant_system/data docs
          git diff --cached --quiet || git commit -m "chore: publish post-market snapshot"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push snapshot after ${attempt} attempts."
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done